[tool.poetry]
name = "sdc-app"
version = "0.1.0"
description = "Dash app to enable interactive running of Scale Dependent Correlation analyses."
authors = ["Alejandro Fontal <alejandrofontal92@gmail.com>"]
license = "BSD"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^1.2.5"
dash = "^1.20.0"
sdcpy = "^0.7.0"
dash-bootstrap-components = "^0.12.2"
whitenoise = "^5.2.0"
redis = "^4.6.0"
rq = "^1.15.1"
dash-ag-grid = "^2.1.0"

[tool.poetry.dev-dependencies]
gunicorn = "^20.1.0"
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
